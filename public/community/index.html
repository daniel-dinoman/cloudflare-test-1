<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orange Peels - Community</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #24150d;
            color: #fff3dc;
            font-family: Arial, sans-serif;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;

            padding: 10px 18px;

            background: #e87500;
            color: white;

            text-decoration: none;
            border-radius: 7px;

            font-weight: bold;
            border: 2px solid #ff9d25;
        }

        .back-button:hover {
            background: #ff8c00;
        }

        h1 {
            margin-top: 55px;
            margin-bottom: 10px;

            color: #f28c18;
            font-size: 45px;
        }

        .subtitle {
            color: #d6b58b;
            margin-bottom: 35px;
        }

        .community-box {
            width: 100%;
            max-width: 700px;

            padding: 30px;

            background: #3a2112;
            border: 3px solid #c76b12;
            border-radius: 12px;

            text-align: center;
        }

        .community-box h2 {
            margin-top: 0;
            color: #f28c18;
        }

        .community-box p {
            color: #fff3dc;
            line-height: 1.6;
            font-size: 17px;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .link-button {
            padding: 13px 25px;

            background: #d66f0b;
            color: white;

            border: 2px solid #f28c18;
            border-radius: 8px;

            text-decoration: none;

            font-size: 16px;
            font-weight: bold;
        }

        .link-button:hover {
            background: #ef8010;
        }
    </style>
</head>

<body>

    <a class="back-button" href="/">
        ← BACK
    </a>

    <div class="page">

        <h1>ORANGE PEELS</h1>

        <div class="subtitle">
            Community
        </div>

        <div class="community-box">

            <h2>JOIN THE COMMUNITY</h2>

            <p>
                Want to keep up with Orange Peels?
                Join the Discord server or contact us by email!
            </p>

            <div class="links">

                <a
                    class="link-button"
                    href="https://discord.gg/DNVUKZRNxX"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    DISCORD
                </a>

                <a
                    class="link-button"
                    href="mailto:danielsmeyersjr@gmail.com"
                >
                    EMAIL
                </a>

            </div>

        </div>

    </div>

</body>
</html>
