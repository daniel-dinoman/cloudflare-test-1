<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Orange Peels Club</title>

    <style>
        body {
            margin: 0;
            background: #17120d;
            color: #fff4df;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
        }

        h1 {
            font-size: 56px;
            margin-bottom: 45px;
            color: #ff9d18;
            text-shadow: 3px 3px 0 #7a3d00;
        }

        .button {
            position: relative;

            width: 280px;
            padding: 18px 20px;
            margin: 9px;

            box-sizing: border-box;

            background-color: #f47c00;
            color: white;

            border: 3px solid #ffad32;
            border-radius: 12px;

            font-size: 21px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;

            /* Orange-peel texture */
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.13) 0 1px, transparent 2px),
                radial-gradient(circle at 70% 60%, rgba(90,35,0,0.18) 0 1px, transparent 2px),
                radial-gradient(circle at 40% 80%, rgba(255,255,255,0.10) 0 1px, transparent 2px);

            background-size: 7px 7px, 9px 9px, 6px 6px;

            box-shadow:
                0 5px 0 #8a4200,
                0 8px 12px rgba(0, 0, 0, 0.4);

            transition: transform 0.12s, box-shadow 0.12s;
        }

        .button:hover {
            background-color: #ff8c0a;
            transform: translateY(-2px);

            box-shadow:
                0 7px 0 #8a4200,
                0 10px 15px rgba(0, 0, 0, 0.45);
        }

        .button:active {
            transform: translateY(4px);

            box-shadow:
                0 2px 0 #8a4200,
                0 4px 8px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>

    <h1>Orange Peels</h1>

    <a class="button" href="/info/">
        Information & Links
    </a>

    <a class="button" href="/community/">
        Community
    </a>

    <a class="button" href="/games/">
        GAMES!!!
    </a>

</body>
</html>
