<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orange Clicker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .reset-button {
            width: 100%;
            margin-top: 20px;
        
            padding: 12px;
        
            background: #7a250f;
            color: #fff4df;
        
            border: 3px solid #a83b18;
            border-radius: 9px;
        
            font-size: 15px;
            font-weight: bold;
        
            cursor: pointer;
        
            box-shadow: 0 4px 0 #451207;
        
            transition: transform 0.1s, background 0.1s;
        }
        
        .reset-button:hover {
            background: #963019;
        }
        
        .reset-button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #451207;
        }


        body {
            margin: 0;
            min-height: 100vh;

            background: #17120d;
            color: #fff4df;

            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* BACK BUTTON */

        .back-button {
            position: absolute;
            top: 15px;
            left: 15px;

            padding: 10px 16px;

            background: #f47c00;
            color: white;

            border: 3px solid #ffad32;
            border-radius: 9px;

            font-size: 16px;
            font-weight: bold;
            text-decoration: none;

            box-shadow: 0 4px 0 #8a4200;

            z-index: 20;
        }

        .back-button:hover {
            background: #ff8c0a;
        }

        /* MAIN GAME */

        .game {
            display: grid;

            grid-template-columns: 220px 1fr 330px;

            width: 100%;
            height: 100vh;
        }

        /* LEFT SIDE */

        .stats {
            padding: 80px 20px 20px;

            background: #21170f;

            border-right: 4px solid #6f350b;
        }

        .stats h2 {
            margin-top: 0;

            color: #ff9d18;
            text-align: center;
        }

        .orange-count {
            text-align: center;

            font-size: 32px;
            font-weight: bold;

            color: #fff3dc;

            margin: 25px 0 10px;
        }

        .per-second {
            text-align: center;

            color: #d99a57;
            font-size: 15px;
        }

        .stat-box {
            margin-top: 30px;

            padding: 15px;

            background: #302015;

            border: 2px solid #77400e;
            border-radius: 10px;
        }

        .stat-box p {
            margin: 8px 0;
        }

        /* CENTER */

        .click-area {
            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            position: relative;

            background: #17120d;
        }

        .title {
            position: absolute;

            top: 65px;

            margin: 0;

            color: #ff9d18;

            font-size: 42px;

            text-shadow: 3px 3px 0 #7a3d00;
        }

        .instruction {
            position: absolute;

            top: 120px;

            color: #d99a57;
        }

        /* ORANGE */

        .orange-button {
            width: 280px;
            height: 280px;

            border: none;
            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: transform 0.1s;
        }

        .orange-button:hover {
            transform: scale(1.05);
        }

        .orange-button:active {
            transform: scale(0.90);
        }

        .orange {
            width: 220px;
            height: 220px;

            border-radius: 50%;

            background: #f47c0b;

            border: 6px solid #c85e05;

            position: relative;

            box-shadow:
                inset -22px -18px 0 #d96605,
                inset 15px 12px 0 #ff9b24,
                0 12px 0 #8a4200,
                0 18px 25px rgba(0, 0, 0, 0.45);
        }

        .orange::after {
            content: "";

            position: absolute;

            width: 12px;
            height: 12px;

            background: #b84f05;

            border-radius: 50%;

            top: 15px;
            left: 50%;

            transform: translateX(-50%);
        }

        .orange-leaf {
            position: absolute;

            width: 55px;
            height: 29px;

            background: #4f7d20;

            border-radius: 100% 0 100% 0;

            top: -18px;
            right: 28px;

            transform: rotate(-20deg);

            border: 3px solid #365c13;
        }

        /* CLICK POPUP */

        .click-text {
            position: absolute;

            pointer-events: none;

            font-size: 24px;
            font-weight: bold;

            color: #ffad32;

            opacity: 0;
        }

        .click-text.pop {
            animation: pop 0.45s ease-out;
        }

        @keyframes pop {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-70px);
                opacity: 0;
            }
        }

        /* SHOP */

        .shop {
            padding: 75px 15px 20px;

            background: #21170f;

            border-left: 4px solid #6f350b;

            overflow-y: auto;
        }

        .shop h2 {
            margin: 0 0 18px;

            text-align: center;

            color: #ff9d18;
        }

        .upgrade {
            width: 100%;

            min-height: 85px;

            margin-bottom: 12px;

            padding: 12px;

            background: #302015;

            color: #fff4df;

            border: 3px solid #77400e;
            border-radius: 10px;

            text-align: left;

            cursor: pointer;

            transition: transform 0.1s, background 0.1s;
        }

        .upgrade:hover {
            background: #3b2819;
            transform: translateX(-3px);
        }

        .upgrade:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .upgrade-name {
            font-size: 17px;
            font-weight: bold;

            color: #ffad32;
        }

        .upgrade-description {
            display: block;

            margin-top: 4px;

            font-size: 13px;

            color: #d4b28c;
        }

        .upgrade-cost {
            display: block;

            margin-top: 7px;

            font-size: 14px;

            font-weight: bold;

            color: #fff3dc;
        }

        /* MOBILE */

        @media (max-width: 850px) {
            body {
                overflow: auto;
            }

            .game {
                grid-template-columns: 1fr;
                height: auto;
                min-height: 100vh;
            }

            .stats {
                border-right: none;
                border-bottom: 4px solid #6f350b;

                padding: 75px 20px 20px;
            }

            .click-area {
                min-height: 600px;
            }

            .shop {
                border-left: none;
                border-top: 4px solid #6f350b;
            }

            .title {
                font-size: 34px;
            }
        }

        @media (max-width: 500px) {
            .orange-button {
                width: 230px;
                height: 230px;
            }

            .orange {
                width: 180px;
                height: 180px;
            }

            .click-area {
                min-height: 500px;
            }
        }
    </style>
</head>

<body>

    <a class="back-button" href="/games/">
        ← Games
    </a>

    <div class="game">

        <!-- STATS -->

        <aside class="stats">

            <h2>ORANGES</h2>

            <div class="orange-count" id="orangeCount">
                0
            </div>

            <div class="per-second" id="perSecond">
                0 oranges / second
            </div>

            <div class="stat-box">
                <p>🍊 Per Click: <b id="perClick">1</b></p>
                <p>🌳 Per Second: <b id="perSecondSmall">0</b></p>
                <p>📦 Upgrades: <b id="upgradeCount">0</b></p>
                <button id="resetSave" class="reset-button">
                    🗑️ Reset Save
                </button>
            </div>

        </aside>


        <!-- CLICK AREA -->

        <main class="click-area">

            <h1 class="title">
                ORANGE CLICKER
            </h1>

            <p class="instruction">
                Click the orange.
            </p>

            <button
                class="orange-button"
                id="orangeButton"
                aria-label="Click the orange"
            >
                <div class="orange">
                    <div class="orange-leaf"></div>
                </div>
            </button>

            <div class="click-text" id="clickText">
                +1 🍊
            </div>

        </main>


        <!-- SHOP -->

        <aside class="shop">

            <h2>ORANGE UPGRADES</h2>

            <button class="upgrade" id="upgradePeel">

                <span class="upgrade-name">
                    🧤 Fancy Peeling Gloves
                </span>

                <span class="upgrade-description">
                    Your hands become 37% more orange-efficient.
                </span>

                <span class="upgrade-cost">
                    Cost: 15 🍊
                </span>

            </button>


            <button class="upgrade" id="upgradeJuice">

                <span class="upgrade-name">
                    🧃 Suspicious Juice Box
                </span>

                <span class="upgrade-description">
                    Somehow produces oranges when nobody is looking.
                </span>

                <span class="upgrade-cost">
                    Cost: 100 🍊
                </span>

            </button>


            <button class="upgrade" id="upgradeTree">

                <span class="upgrade-name">
                    🌳 Orange Tree
                </span>

                <span class="upgrade-description">
                    It is just a tree. What did you expect?
                </span>

                <span class="upgrade-cost">
                    Cost: 500 🍊
                </span>

            </button>


            <button class="upgrade" id="upgradeGrandma">

                <span class="upgrade-name">
                    👵 Orange Grandma
                </span>

                <span class="upgrade-description">
                    She has been peeling oranges since 1847.
                </span>

                <span class="upgrade-cost">
                    Cost: 2,500 🍊
                </span>

            </button>


            <button class="upgrade" id="upgradeFactory">

                <span class="upgrade-name">
                    🏭 Orange Factory
                </span>

                <span class="upgrade-description">
                    Legally questionable orange production.
                </span>

                <span class="upgrade-cost">
                    Cost: 10,000 🍊
                </span>

            </button>


            <button class="upgrade" id="upgradeGovernment">

                <span class="upgrade-name">
                    🏛️ Orange Government
                </span>

                <span class="upgrade-description">
                    The oranges now tax themselves.
                </span>

                <span class="upgrade-cost">
                    Cost: 50,000 🍊
                </span>

            </button>


            <button class="upgrade" id="upgradeDimension">

                <span class="upgrade-name">
                    🌀 Orange Dimension
                </span>

                <span class="upgrade-description">
                    Somewhere, an infinite amount of oranges exist.
                </span>

                <span class="upgrade-cost">
                    Cost: 250,000 🍊
                </span>

            </button>

        </aside>

    </div>

    <script src="game.js"></script>

</body>
</html>
