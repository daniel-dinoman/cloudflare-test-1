<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orange Peel Club Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #17120d;
            color: #fff4df;

            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* BACK BUTTON */

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;

            padding: 12px 20px;

            background-color: #f47c00;
            color: white;

            border: 3px solid #ffad32;
            border-radius: 10px;

            font-size: 18px;
            font-weight: bold;
            text-decoration: none;

            box-shadow: 0 4px 0 #8a4200;

            transition: transform 0.12s, box-shadow 0.12s;

            z-index: 10;
        }

        .back-button:hover {
            background-color: #ff8c0a;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #8a4200;
        }

        .back-button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #8a4200;
        }


        /* TITLE */

        h1 {
            margin-top: 70px;
            margin-bottom: 30px;

            font-size: 48px;
            color: #ff9d18;

            text-shadow: 3px 3px 0 #7a3d00;

            text-align: center;
        }


        /* GAME LIST */

        .game-frame {
            width: min(800px, 90vw);
            height: 500px;

            padding: 20px;

            background-color: #241a11;

            border: 4px solid #a85400;
            border-radius: 15px;

            overflow-y: auto;

            box-shadow: 0 8px 0 #0d0906;
        }

        /* Scrollbar */

        .game-frame::-webkit-scrollbar {
            width: 14px;
        }

        .game-frame::-webkit-scrollbar-track {
            background: #120e0a;
            border-radius: 10px;
        }

        .game-frame::-webkit-scrollbar-thumb {
            background-color: #f47c00;
            border-radius: 10px;
            border: 3px solid #120e0a;
        }

        .game-frame::-webkit-scrollbar-thumb:hover {
            background-color: #ff9d18;
        }


        /* GAME BUTTONS */

        .game-button {
            display: block;

            width: 100%;

            padding: 20px;
            margin-bottom: 15px;

            background-color: #f47c00;
            color: white;

            border: 3px solid #ffad32;
            border-radius: 12px;

            font-size: 23px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;

            box-shadow: 0 5px 0 #8a4200;

            transition: transform 0.12s, box-shadow 0.12s;
        }

        .game-button:hover {
            background-color: #ff8c0a;

            transform: translateY(-2px);

            box-shadow: 0 7px 0 #8a4200;
        }

        .game-button:active {
            transform: translateY(4px);

            box-shadow: 0 1px 0 #8a4200;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .back-button {
                top: 12px;
                left: 12px;

                padding: 9px 14px;
                font-size: 15px;
            }

            h1 {
                margin-top: 65px;
                margin-bottom: 25px;

                font-size: 34px;
            }

            .game-frame {
                width: 92vw;
                height: 450px;

                padding: 14px;
            }

            .game-button {
                padding: 17px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- BACK BUTTON -->

    <a class="back-button" href="/">
        ← Back
    </a>


    <!-- TITLE -->

    <h1>Orange Peel Club Games</h1>


    <!-- SCROLLABLE GAME FRAME -->

    <div class="game-frame">

        <a class="game-button" href="/games/orangle">
            Orangle
        </a>

        <a class="game-button" href="/games/eaglercraft">
            Eaglercraft
        </a>

        <a class="game-button" href="/games/clicker">
            Orange Clicker
        </a>

        <a class="game-button" href="/games/peelerz">
            Peelerz
        </a>

    </div>

</body>
</html>
