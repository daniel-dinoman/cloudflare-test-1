<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orangle</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #24150d;
            color: #fff3df;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #ff8c00;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-top: 5px;
            margin-bottom: 18px;
            color: #d9b892;
            font-size: 15px;
        }

        #board {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            gap: 6px;
        }

        .tile {
            width: 58px;
            height: 58px;
            border: 2px solid #704326;
            background: #2e1b10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            border-radius: 5px;
        }

        .tile.correct {
            background: #e87500;
            border-color: #ff9d25;
        }

        .tile.wrong-place {
            background: #8a641e;
            border-color: #c79a3b;
        }

        .tile.wrong {
            background: #4a3427;
            border-color: #5d4434;
        }

        #keyboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
        }

        .keyboard-row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .key {
            min-width: 38px;
            height: 48px;
            padding: 0 8px;
            border: none;
            border-radius: 5px;
            background: #704326;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .key:hover {
            background: #8c542d;
        }

        .key:active {
            transform: scale(0.95);
        }

        .key.wide {
            min-width: 62px;
        }

        .key.correct {
            background: #e87500;
        }

        .key.wrong-place {
            background: #8a641e;
        }

        .key.wrong {
            background: #3c3029;
            color: #8d8178;
        }

        #message {
            min-height: 28px;
            margin-top: 15px;
            color: #ffae42;
            font-weight: bold;
            font-size: 16px;
        }

        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #e87500;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
            border: 2px solid #ff9d25;
        }

        .back-button:hover {
            background: #ff8c00;
        }

        @media (max-width: 500px) {
            .game {
                padding: 12px;
            }

            h1 {
                font-size: 32px;
            }

            .tile {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }

            .key {
                min-width: 30px;
                height: 44px;
                padding: 0 5px;
                font-size: 12px;
            }

            .key.wide {
                min-width: 52px;
            }

            .keyboard-row {
                gap: 3px;
            }
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>Orangle</h1>

        <div class="subtitle">
            oranges and peels lol
        </div>

        <div id="board"></div>

        <div id="keyboard"></div>

        <div id="message"></div>

        <a class="back-button" href="/games/">
            ← BACK TO GAMES
        </a>

    </div>

    <script src="game.js"></script>

</body>
</html>
