<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Orange</title>

    <style>
        body {
            margin: 0;
            background: #17120d;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .game-container {
            position: relative;
        }

        canvas {
            display: block;
            background: #87ceeb;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;

            padding: 10px 16px;
            background: #f47c00;
            color: #fff4df;
            border: 2px solid #ffad32;
            border-radius: 8px;

            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .back-button:hover {
            background: #ff8c00;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;

            color: white;
            font-size: 40px;
            font-weight: bold;
            text-align: center;

            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        }

        #game-over {
            position: absolute;
            inset: 0;

            display: none;
            justify-content: center;
            align-items: center;

            background: rgba(0, 0, 0, 0.45);
        }

        .game-over-box {
            text-align: center;
            color: #fff4df;
        }

        .game-over-box h1 {
            margin: 0 0 15px;
            font-size: 55px;
        }

        .game-over-box p {
            margin: 8px 0;
            font-size: 25px;
        }

        .final-score {
            font-weight: bold;
            font-size: 30px !important;
        }
    </style>
</head>

<body>

<a href="/games" class="back-button">← Back to Games</a>

<div class="game-container">

    <canvas id="game" width="800" height="600"></canvas>

    <div id="score">0</div>

    <div id="game-over">
        <div class="game-over-box">
            <h1>GAME OVER</h1>
            <p>Press any key to restart</p>
            <p class="final-score">
                Score: <span id="final-score">0</span>
            </p>
        </div>
    </div>

</div>

<script src="game.js"></script>

</body>
</html>
