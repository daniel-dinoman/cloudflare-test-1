<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Peelerz</title>

    <style>
        * {
            box-sizing: border-box;
        }
        .inventory-title {
            color: #f28c18;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .inventory {
            min-height: 90px;
            padding: 10px;
        
            background: #24150d;
            border: 2px solid #6b3510;
            border-radius: 8px;
        
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .empty-inventory {
            color: #d6b58b;
            width: 100%;
            text-align: center;
            padding: 20px;
        }
        
        .inventory-item {
            padding: 8px 10px;
        
            background: #6b3510;
            border: 2px solid #c76b12;
            border-radius: 6px;
        
            color: #fff3dc;
            font-weight: bold;
        
            cursor: pointer;
        }
        
        .inventory-item:hover {
            background: #8a4512;
        }
        
        .craft-slots {
            display: flex;
            align-items: center;
            justify-content: center;
        
            gap: 8px;
            margin-top: 25px;
        }
        
        .craft-slot {
            width: 75px;
            height: 75px;
        
            background: #24150d;
            border: 3px solid #c76b12;
            border-radius: 8px;
        
            color: #fff3dc;
            font-size: 13px;
            font-weight: bold;
        
            cursor: pointer;
        }
        
        .craft-slot:hover {
            background: #4a2814;
        }
        
        .plus {
            color: #f28c18;
            font-size: 24px;
            font-weight: bold;
        }
        
        .craft-action {
            display: block;
        
            margin: 25px auto 0;
            padding: 12px 30px;
        
            background: #d66f0b;
            border: 2px solid #f28c18;
            border-radius: 8px;
        
            color: white;
            font-size: 16px;
            font-weight: bold;
        
            cursor: pointer;
        }
        
        .craft-action:hover {
            background: #ef8010;
        }
        .peeling {
            transform: scale(0.85) rotate(-8deg);
        }
        
        .peeling .orange {
            transform: rotate(15deg);
        }
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
        
            padding: 10px 18px;
        
            background: #e87500;
            color: white;
        
            text-decoration: none;
            border-radius: 7px;
        
            font-weight: bold;
            border: 2px solid #ff9d25;
        
            z-index: 1000;
        }
        
        .back-button:hover {
            background: #ff8c00;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #24150d;
            color: #fff3dc;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .game {
            width: 100%;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title */

        .title {
            margin-top: 25px;
            font-size: 42px;
            font-weight: 900;
            color: #f28c18;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-top: -8px;
            color: #d6b58b;
            font-size: 15px;
        }

        /* Main game area */

        .game-area {
            width: 100%;
            max-width: 1000px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Fruit switcher */

        .fruit-switcher {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);

            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .switch-button {
            width: 55px;
            height: 45px;

            border: 2px solid #c76b12;
            border-radius: 8px;

            background: #6b3510;
            color: #fff3dc;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;
        }

        .switch-button:hover {
            background: #8a4512;
        }

        .fruit-name {
            font-size: 17px;
            font-weight: bold;
            color: #f28c18;
        }

        /* Center fruit */

        .fruit-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .fruit {
    width: 260px;
    height: 260px;
    border: none;
    background: transparent;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: transform 0.12s ease;
}

.fruit:hover {
    transform: scale(1.05);
}

.fruit:active {
    transform: scale(0.92);
}

.orange {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: #f47c0b;
    border: 5px solid #c85e05;
    position: relative;

    box-shadow:
        inset -18px -15px 0 #d96605,
        inset 12px 10px 0 #ff9b24;
}

.orange::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    background: #b84f05;
    border-radius: 50%;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
}

.orange-leaf {
    position: absolute;
    width: 48px;
    height: 25px;
    background: #4f7d20;
    border-radius: 100% 0 100% 0;
    top: -15px;
    right: 25px;
    transform: rotate(-20deg);
    border: 3px solid #365c13;
}

        .click-text {
            margin-top: 15px;
            color: #d6b58b;
            font-size: 16px;
            font-weight: bold;
        }

        /* Result */

        .result {
            min-height: 35px;
            margin-top: 20px;

            color: #f28c18;
            font-size: 20px;
            font-weight: bold;

            text-align: center;
        }

        /* Craft button */

        .craft-button {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);

            padding: 16px 25px;

            border: 2px solid #f28c18;
            border-radius: 9px;

            background: #d66f0b;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .craft-button:hover {
            background: #ef8010;
        }

        /* Crafting menu */

        .craft-menu {
            position: absolute;

            width: 500px;
            max-width: calc(100% - 30px);

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            padding: 25px;

            background: #3a2112;
            border: 3px solid #c76b12;
            border-radius: 12px;

            display: none;
            z-index: 10;
        }

        .craft-menu.open {
            display: block;
        }

        .craft-title {
            margin: 0 0 20px;

            text-align: center;

            color: #f28c18;
            font-size: 28px;
        }

        .close-button {
            position: absolute;
            right: 15px;
            top: 12px;

            border: none;
            background: transparent;

            color: #fff3dc;
            font-size: 24px;

            cursor: pointer;
        }

        .craft-placeholder {
            text-align: center;
            color: #d6b58b;
            padding: 30px 10px;
        }

        /* Mobile */

        @media (max-width: 700px) {
            .title {
                font-size: 34px;
            }

            .fruit-switcher {
                left: 10px;
            }

            .craft-button {
                right: 10px;
                padding: 12px 15px;
                font-size: 15px;
            }

            .fruit {
                font-size: 130px;
                width: 190px;
                height: 190px;
            }
        }
    </style>
</head>

<body>
    <a class="back-button" href="/games/">
        ← BACK TO GAMES
    </a>
    <div class="game">

        <div class="title">PEELERZ</div>
        <div class="subtitle">peel and craft and stuff lulz</div>

        <div class="game-area">

            <!-- Fruit switching -->

            <div class="fruit-switcher">
                <button class="switch-button" id="previousFruit">◀</button>

                <div class="fruit-name" id="fruitName">
                    ORANGE
                </div>

                <button class="switch-button" id="nextFruit">▶</button>
            </div>

            <!-- Main fruit -->

            <div class="fruit-area">

            <button class="fruit" id="fruitButton" aria-label="Peel orange">
                <div class="orange">
                    <div class="orange-leaf"></div>
                </div>
            </button>

                <div class="click-text">
                    CLICK THE FRUIT TO PEEL
                </div>

                <div class="result" id="result">
                </div>

            </div>

            <!-- Craft -->

            <button class="craft-button" id="craftButton">
                CRAFT
            </button>

            <!-- Crafting menu -->

            <div class="craft-menu" id="craftMenu">
            
                <button class="close-button" id="closeCraft">
                    ×
                </button>
            
                <h2 class="craft-title">CRAFTING</h2>
            
                <div class="inventory-title">
                    INVENTORY
                </div>
            
                <div class="inventory" id="inventory">
                    <div class="empty-inventory">
                        Nothing here yet!
                    </div>
                </div>
            
                <div class="craft-slots">
            
                    <button class="craft-slot" id="slot1"></button>
            
                    <div class="plus">+</div>
            
                    <button class="craft-slot" id="slot2"></button>
            
                    <div class="plus">+</div>
            
                    <button class="craft-slot" id="slot3"></button>
            
                </div>
            
                <button class="craft-action" id="craftAction">
                    CRAFT
                </button>
            
            </div>

        </div>

    </div>

    <script src="game.js"></script>

</body>
</html>
